[project]
name = "entirius-django-checkout"
version = "9.2.0"
description = "Checkout engine for Django: carts, orders, payment intents (PayU, PayPal, Autopay, Przelewy24, Paynow, Stripe), shipping, discounts and sale offers"
authors = [{ name = "Entirius" }]
maintainers = [
    { name = "Piotr Brzozowski" },
    { name = "Paweł Kiełt" },
    { name = "Mateusz Baran" },
    { name = "Michał Kloczkowski" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "django-filter>=23.0",
    "django-admin-inline-paginator>=0.3.0",
    "pydantic>=2.0",
    "marshmallow",
    "marshmallow-dataclass",
    "celery",
    "stripe>=11.6.0",
    "pandas>=2.0",
    "tqdm",
    "pytz",
    "entirius-django-utils>=2.0.0",
    "entirius-django-regional>=2.0.0",
    "entirius-django-pim>=3.0.0",
    "entirius-django-accounts>=5.0.0",
    "entirius-django-pricemanager>=4.0.1",
    "entirius-py-payu-sdk>=2.0.0",
    "entirius-py-paypal-sdk>=2.0.0",
    "entirius-py-autopay-sdk>=2.0.0",
    "entirius-py-przelewy24-sdk>=2.0.0",
    "entirius-py-paynow-sdk>=2.0.0",
    "entirius-py-bievents>=2.0.0",
    "entirius-py-idx-normalizator>=2.0.0",
    "entirius-py-process-logger>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "dj-database-url", "psycopg[binary]", "entirius-django-captcha>=2.0.0"]
# Soft integrations — imported lazily (try/except ImportError) with graceful degradation.
qms        = ["entirius-django-qms>=4.0.0"]            # stock sync command reads QMS warehouse/xray when present
vault      = ["entirius-django-vault>=2.0.0"]          # card-on-file storage for PayU card payments
# Own satellites — they depend on this package; imported lazily here (no FK), so optional:
returns = ["entirius-django-returns>=3.0.0"]                   # returnable-orders lookup in views/order.py

[project.urls]
Repository = "https://github.com/entirius/entirius-django-checkout"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_checkout"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106", "S108"]
# Legacy migrated 1:1 — pre-existing lint debt, tracked outside this repo; do not grow these lists.
"src/django_checkout/admin.py" = ["S308"]
"src/django_checkout/api/**" = ["B904"]
"src/django_checkout/domain/**" = ["B007", "B026", "B904", "C401", "C408", "C416", "E731", "F401", "F821", "F841", "S324"]
"src/django_checkout/models/**" = ["B007", "B026", "C419", "DJ001", "DJ008", "DJ012", "E712", "F821", "F841", "S324"]
"src/django_checkout/utils/**" = ["B026", "B905"]
"src/django_checkout/views/**" = ["B026", "B904", "C408", "C416", "E722", "S314"]
"src/django_checkout/worker/**" = ["B007", "B020", "B023", "B026", "B904", "C416", "E731", "F401", "F811", "F821", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["django_checkout"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
